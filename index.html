<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATMI GROUP — Delivery Docket</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;font-size:14px;background:#f4f5f7;color:#1a1a1a}
.app{max-width:960px;margin:0 auto;padding:1rem}
.topbar{display:flex;align-items:center;gap:12px;background:#fff;border-radius:10px;padding:12px 16px;margin-bottom:16px;border:1px solid #e0e0e0}
.logo-circle{width:40px;height:40px;border-radius:50%;background:#1a5fa8;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.topbar-title{font-size:16px;font-weight:600}
.topbar-sub{font-size:12px;color:#666}
.nav{display:flex;gap:8px;margin-bottom:16px}
.nav button{background:#fff;border:1px solid #ddd;padding:8px 18px;border-radius:8px;cursor:pointer;font-size:13px;color:#444}
.nav button.active{background:#1a5fa8;color:#fff;border-color:#1a5fa8;font-weight:500}
.page{display:none}.page.active{display:block}
.card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:16px;margin-bottom:14px}
.section-title{font-size:11px;font-weight:600;color:#888;margin-bottom:12px;text-transform:uppercase;letter-spacing:0.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;color:#555;font-weight:500}
.field input,.field select,.field textarea{width:100%;padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:13px;background:#fff;color:#1a1a1a}
.field input:focus,.field select:focus{outline:none;border-color:#1a5fa8}
.items-table{width:100%;border-collapse:collapse;font-size:13px}
.items-table th{text-align:left;padding:8px;background:#f0f4f8;font-weight:600;font-size:11px;color:#555;border-bottom:1px solid #ddd}
.items-table td{padding:6px 8px;border-bottom:1px solid #eee;vertical-align:middle}
.items-table input{width:100%;border:1px solid #ddd;border-radius:4px;padding:4px 6px;font-size:12px}
.btn{padding:8px 16px;border-radius:7px;border:1px solid #ccc;background:#fff;color:#333;cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{background:#f5f5f5}
.btn-primary{background:#1a5fa8;color:#fff;border-color:#1a5fa8}
.btn-primary:hover{background:#154d8c}
.btn-print{background:#fff;color:#333;border-color:#ccc}
.btn-danger{color:#c0392b;border-color:#c0392b}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-success{background:#27ae60;color:#fff;border-color:#27ae60}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}
.badge{display:inline-block;padding:3px 10px;border-radius:6px;font-size:11px;font-weight:600}
.badge-draft{background:#f0f0f0;color:#666}
.badge-issued{background:#dbeafe;color:#1e40af}
.badge-delivered{background:#fef3c7;color:#92400e}
.badge-completed{background:#d1fae5;color:#065f46}
.docket-list{display:flex;flex-direction:column;gap:8px}
.docket-item{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fff;border:1px solid #e0e0e0;border-radius:8px;cursor:pointer;transition:background 0.15s}
.docket-item:hover{background:#f0f4f8}
.signed-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #eee}
.signed-row:last-child{border-bottom:none}
.img-thumb{width:52px;height:52px;object-fit:cover;border-radius:5px;border:1px solid #ddd}
.msg{padding:10px 14px;border-radius:7px;font-size:13px;margin-bottom:12px;display:none}
.msg.show{display:block}
.msg-success{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
.msg-error{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.loading{text-align:center;padding:2rem;color:#888;font-size:13px}
.search-bar{display:flex;gap:8px;margin-bottom:12px}
.search-bar input{flex:1;padding:8px 12px;border:1px solid #ccc;border-radius:7px;font-size:13px}
.filter-select{padding:8px 10px;border:1px solid #ccc;border-radius:7px;font-size:13px}

/* PRINT STYLES */
@media print {
  body{background:#fff;margin:0!important;padding:0!important}
  .app,.nav,.topbar,.no-print{display:none!important}
  .print-area{display:block!important}
  @page{size:A4 portrait}
  
}
.print-area{display:none}

.print-doc{font-family:Arial,sans-serif;font-size:10.5px;color:#000;width:100%;page-break-after:always;box-sizing:border-box}
.print-doc:last-child{page-break-after:avoid}
.ph{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #1a5fa8;padding-bottom:8px;margin-bottom:10px}
.ph-left{display:flex;align-items:center;gap:10px}
.ph-logo{width:42px;height:42px;border-radius:50%;background:#1a5fa8;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;flex-shrink:0}
.ph-company{font-size:12px;font-weight:700;color:#1a5fa8}
.ph-doctitle{font-size:17px;font-weight:700;letter-spacing:0.5px;color:#000}
.ph-sub{font-size:10px;color:#555;margin-top:2px}
.ph-meta{border:1.5px solid #1a5fa8;border-radius:5px;padding:6px 10px;min-width:170px;font-size:10px}
.ph-meta-row{display:flex;justify-content:space-between;gap:10px;padding:1.5px 0}
.ph-meta-row span{color:#555}
.ph-meta-row strong{font-weight:700;color:#000}

.pt{width:100%;border-collapse:collapse;margin-bottom:10px;font-size:10px}
.pt thead tr{background:#1a5fa8}
.pt th{color:#fff;padding:5px 6px;text-align:left;font-weight:600;font-size:10px}
.pt td{padding:5px 6px;border-bottom:0.5px solid #ddd;vertical-align:middle}
.pt tr:nth-child(even) td{background:#f7f9fc}

.sign-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;border:1.5px solid #aaa;border-radius:4px;overflow:hidden;margin-bottom:8px}
.sign-col{padding:8px;border-right:1px solid #aaa}
.sign-col:last-child{border-right:none}
.sign-col-label{font-size:9px;font-weight:700;color:#1a5fa8;text-transform:uppercase;letter-spacing:0.3px;margin-bottom:3px}
.sign-col-name{font-weight:600;font-size:10px;min-height:13px}
.sign-col-date{font-size:9px;color:#555;margin-top:1px;min-height:11px}
.sign-space{border-bottom:1px solid #999;height:38px;margin:8px 4px 4px;position:relative}
.sign-space-lbl{position:absolute;bottom:-10px;left:0;font-size:8px;color:#aaa;font-style:italic}

.pf{display:flex;justify-content:space-between;font-size:8.5px;color:#888;padding-top:4px;border-top:0.5px solid #ccc;margin-top:6px}
.pf-center{text-align:center;flex:2}
.pf-right{text-align:right;flex:1}
.pf-left{flex:1}
</style>
</head>
<body>

<div class="app">
  <div class="topbar" style="padding:8px 16px">
    <img id="company-logo"
         src="https://lh3.googleusercontent.com/d/1He5NOU_Twr-CqctiFIuJFNe5wf-d-cTP"
         style="max-height:56px;max-width:260px;object-fit:contain"
         onerror="this.style.display='none';document.getElementById('logo-fallback').style.display='flex'"
         alt="ATMI GROUP">
    <div id="logo-fallback" style="display:none;align-items:center;gap:12px">
      <div class="logo-circle">ATMI</div>
      <div>
        <div class="topbar-title">ATMI GROUP</div>
        <div class="topbar-sub">Delivery Docket System</div>
      </div>
    </div>
  </div>

  <div class="nav no-print">
    <button class="active" onclick="showPage('new')">＋ New Docket</button>
    <button onclick="showPage('list')">☰ All Dockets</button>
  </div>

  <!-- NEW DOCKET -->
  <div id="page-new" class="page active">
    <div id="msg-new" class="msg"></div>
    <div class="card">
      <div class="section-title">Docket information</div>
      <div class="grid3" style="margin-bottom:12px">
        <div class="field"><label>Request date</label><input type="date" id="f-reqdate"></div>
        <div class="field"><label>Project</label><input type="text" id="f-project" placeholder="Project name"></div>
        <div class="field"><label>Job number</label><input type="text" id="f-jobno" placeholder="e.g. ATMI-26-0001"></div>
      </div>
      <div class="field"><label>Send to</label><input type="text" id="f-sendto" placeholder="Recipient name / company"></div>
    </div>

    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div class="section-title" style="margin:0">Items</div>
        <button class="btn btn-sm" onclick="addItem()">＋ Add item</button>
      </div>
      <table class="items-table">
        <thead><tr>
          <th style="width:36px">No.</th>
          <th>Description</th>
          <th style="width:65px">Qty</th>
          <th style="width:75px">Unit</th>
          <th style="width:110px">Picture</th>
          <th>Remark</th>
          <th style="width:32px"></th>
        </tr></thead>
        <tbody id="items-body"></tbody>
      </table>
    </div>

    <div class="card">
      <div class="section-title">Responsible persons</div>
      <div class="grid2" style="margin-bottom:12px">
        <div class="field"><label>Issue by</label><input type="text" id="f-issueby" placeholder="Name"></div>
        <div class="field"><label>Issue date</label><input type="date" id="f-issuedate"></div>
      </div>
      <div class="grid2" style="margin-bottom:12px">
        <div class="field"><label>Check by</label><input type="text" id="f-checkby" placeholder="Name"></div>
        <div class="field"><label>Check date</label><input type="date" id="f-checkdate"></div>
      </div>
      <div class="grid3" style="margin-bottom:12px">
        <div class="field"><label>Delivery by</label><input type="text" id="f-deliveryby" placeholder="Name"></div>
        <div class="field"><label>Car number plate</label><input type="text" id="f-carplate" placeholder="e.g. กข 1234"></div>
        <div class="field"><label>Delivery date</label><input type="date" id="f-deliverydate"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Received by</label><input type="text" id="f-receivedby" placeholder="Name"></div>
        <div class="field"><label>Received date</label><input type="date" id="f-receiveddate"></div>
      </div>
    </div>

    <div class="actions no-print">
      <button class="btn btn-danger btn-sm" onclick="clearForm()">✕ Clear</button>
      <button class="btn btn-print btn-sm" onclick="previewAndPrint()">⎙ Print preview</button>
      <button class="btn btn-primary" onclick="saveDocket()">💾 Save docket</button>
    </div>
  </div>

  <!-- ALL DOCKETS -->
  <div id="page-list" class="page">
    <div class="card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
        <div class="section-title" style="margin:0">All dockets</div>
        <button class="btn btn-sm" onclick="loadDockets()">↺ Refresh</button>
      </div>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search by docket no. or project..." oninput="filterDockets()">
        <select class="filter-select" id="status-filter" onchange="filterDockets()">
          <option value="">All status</option>
          <option value="Draft">Draft</option>
          <option value="Issued">Issued</option>
          <option value="Delivered">Delivered</option>
          <option value="Completed">Completed</option>
        </select>
      </div>
      <div id="docket-list-container"><div class="loading">Loading...</div></div>
    </div>
  </div>

  <!-- DETAIL -->
  <div id="page-detail" class="page">
    <div class="no-print" style="display:flex;gap:8px;margin-bottom:12px;align-items:center">
      <button class="btn btn-sm" onclick="showPage('list')">← Back</button>
      <div style="flex:1"></div>
      <button class="btn btn-sm" id="btn-edit-detail" onclick="toggleEditMode()" style="border-color:#f59e0b;color:#92400e;background:#fffbeb">✏️ Edit</button>
      <button class="btn btn-sm btn-primary" id="btn-save-edit" onclick="saveEdit()" style="display:none">💾 Save changes</button>
      <button class="btn btn-sm" id="btn-cancel-edit" onclick="cancelEdit()" style="display:none">✕ Cancel</button>
      <button class="btn btn-print btn-sm" id="btn-print-detail" onclick="printCurrentDetail()">⎙ Print</button>
    </div>
    <div id="msg-detail" class="msg"></div>
    <div id="detail-container"></div>
  </div>
</div>

<!-- PRINT AREA -->
<div class="print-area" id="print-area"></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzxuY24DIg6lV_GK4WtEfpbToBOP97csNcmdXT2u5dZirOrVYZ3B1QmblYRQ_DcHmB8/exec';
let itemCount = 0;
let uploadedFiles = {};
let allDocketsCache = [];
let currentDocketItems = null;

function showPage(p) {
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(el => el.classList.remove('active'));
  document.getElementById('page-' + p).classList.add('active');
  if (p === 'list') { loadDockets(); document.querySelectorAll('.nav button')[1].classList.add('active'); }
  else if (p === 'new') document.querySelectorAll('.nav button')[0].classList.add('active');
}

function addItem() {
  itemCount++;
  const tbody = document.getElementById('items-body');
  const tr = document.createElement('tr');
  tr.id = 'item-row-' + itemCount;
  tr.innerHTML = `
    <td style="text-align:center;color:#888">${itemCount}</td>
    <td><input type="text" placeholder="Description" id="desc-${itemCount}"></td>
    <td><input type="number" placeholder="0" id="qty-${itemCount}" min="0"></td>
    <td><input type="text" placeholder="pcs/set/m" id="unit-${itemCount}"></td>
    <td>
      <input type="file" accept="image/*" id="file-${itemCount}" style="display:none" onchange="handleFile(${itemCount},this)">
      <button class="btn btn-sm" onclick="document.getElementById('file-${itemCount}').click()">📷</button>
      <div id="fname-${itemCount}" style="font-size:10px;color:#888;margin-top:2px"></div>
    </td>
    <td><input type="text" placeholder="Remark" id="remark-${itemCount}"></td>
    <td><button class="btn btn-sm" onclick="removeItem(${itemCount})" style="color:#c0392b">✕</button></td>`;
  tbody.appendChild(tr);
}

function removeItem(n) {
  const row = document.getElementById('item-row-' + n);
  if (row) row.remove();
  delete uploadedFiles[n];
}

function handleFile(n, input) {
  const file = input.files[0];
  if (!file) return;
  document.getElementById('fname-' + n).textContent = file.name;
  const reader = new FileReader();
  reader.onload = e => {
    uploadedFiles[n] = { base64: e.target.result.split(',')[1], mimeType: file.type, fileName: file.name };
  };
  reader.readAsDataURL(file);
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg show msg-' + type;
  setTimeout(() => el.classList.remove('show'), 5000);
}

function fmtDateTime() {
  const n = new Date();
  return n.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + '  ' +
    n.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}

function getFormItems() {
  const rows = document.querySelectorAll('#items-body tr');
  const items = [];
  let valid = true;
  rows.forEach(row => {
    const n = row.id.replace('item-row-', '');
    const desc = document.getElementById('desc-' + n)?.value || '';
    if (!desc) { valid = false; return; }
    items.push({
      itemNo: items.length + 1,
      description: desc,
      qty: document.getElementById('qty-' + n)?.value || '',
      unit: document.getElementById('unit-' + n)?.value || '',
      picture: uploadedFiles[n]?.fileName || '',
      remark: document.getElementById('remark-' + n)?.value || '',
      imageData: uploadedFiles[n]?.base64 || null,
      mimeType: uploadedFiles[n]?.mimeType || null,
      fileName: uploadedFiles[n]?.fileName || null,
      previewUrl: uploadedFiles[n]?.base64 ? ('data:' + (uploadedFiles[n].mimeType||'image/jpeg') + ';base64,' + uploadedFiles[n].base64) : null,
    });
  });
  return { items, valid };
}

function getFormHeader() {
  return {
    requestDate: document.getElementById('f-reqdate').value,
    project: document.getElementById('f-project').value,
    jobNumber: document.getElementById('f-jobno').value,
    sendTo: document.getElementById('f-sendto').value,
    nameIssueBy: document.getElementById('f-issueby').value,
    issueDate: document.getElementById('f-issuedate').value,
    nameCheckBy: document.getElementById('f-checkby').value,
    checkDate: document.getElementById('f-checkdate').value,
    nameDeliveryBy: document.getElementById('f-deliveryby').value,
    deliveryDate: document.getElementById('f-deliverydate').value,
    carNumberPlate: document.getElementById('f-carplate').value,
    nameReceivedBy: document.getElementById('f-receivedby').value,
    receivedDate: document.getElementById('f-receiveddate').value,
  };
}

// ---- PRINT ----
const ITEMS_PER_PAGE = 14;

function buildPrintPage(items, header, totalPages, pageNum) {
  const d = { ...header, ...items[0] };
  const now = fmtDateTime();
  const rows = items.map(item => `
    <tr>
      <td style="text-align:center;width:28px">${item.itemNo}</td>
      <td>${item.description || '-'}</td>
      <td style="text-align:center;width:40px">${item.qty || '-'}</td>
      <td style="text-align:center;width:46px">${item.unit || '-'}</td>
      <td style="width:60px">${item.remark || '—'}</td>
      <td style="text-align:center;width:90px">${item.previewUrl
        ? `<img src="${item.previewUrl}" style="width:80px;height:80px;object-fit:cover;border-radius:4px;border:1px solid #ddd" alt="">`
        : item.picture
          ? `<img src="https://drive.google.com/thumbnail?id=${item.picture}&sz=w120" style="width:80px;height:80px;object-fit:cover;border-radius:4px;border:1px solid #ddd" onerror="this.style.display='none'" alt="">`
          : '<div style="width:80px;height:80px;border:1px dashed #ccc;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#ccc">📷</div>'}</td>
    </tr>`).join('');

  return `
  <div class="print-doc">

    <!-- HEADER: Logo + Title side by side -->
    <div style="display:flex;align-items:center;justify-content:space-between;border-bottom:2.5px solid #1a5fa8;padding-bottom:10px;margin-bottom:10px">
      <div style="flex:1">
        ${logoDataUrl
          ? `<img src="${logoDataUrl}" style="max-height:80px;max-width:300px;object-fit:contain;display:block" alt="ATMI GROUP">`
          : `<div style="display:flex;align-items:center;gap:8px"><div style="width:44px;height:44px;border-radius:50%;background:#1a5fa8;display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700">ATMI</div><div style="font-size:14px;font-weight:700;color:#1a5fa8">ATMI GROUP</div></div>`
        }
      </div>
      <div style="text-align:right">
        <div style="font-size:20px;font-weight:900;color:#1a5fa8;letter-spacing:1px;text-transform:uppercase">MEMO SHEET</div>
        <div style="font-size:16px;font-weight:700;color:#1a5fa8;letter-spacing:0.5px">DELIVERY DOCKET</div>
      </div>
    </div>

    <!-- DOCKET INFO: full width table like items -->
    <table style="width:100%;border-collapse:collapse;margin-bottom:10px;font-size:11px;border:1.5px solid #1a5fa8">
      <thead>
        <tr style="background:#1a5fa8">
          <th style="color:#fff;padding:6px 10px;text-align:left;font-size:11px;width:25%">Docket No.</th>
          <th style="color:#fff;padding:6px 10px;text-align:left;font-size:11px;width:25%">Request Date</th>
          <th style="color:#fff;padding:6px 10px;text-align:left;font-size:11px;width:25%">Project</th>
          <th style="color:#fff;padding:6px 10px;text-align:left;font-size:11px;width:25%">Job Number</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td style="padding:7px 10px;font-weight:700;font-size:13px;border-right:1px solid #ddd">${d.docNo || 'DRAFT'}</td>
          <td style="padding:7px 10px;font-weight:600;font-size:12px;border-right:1px solid #ddd">${fmtDateClean(d.requestDate)}</td>
          <td style="padding:7px 10px;font-weight:600;font-size:12px;border-right:1px solid #ddd">${d.project || '-'}</td>
          <td style="padding:7px 10px;font-weight:600;font-size:12px">${d.jobNumber || '-'}</td>
        </tr>
      </tbody>
    </table>
    <table style="width:100%;border-collapse:collapse;margin-bottom:10px;font-size:11px;border:1.5px solid #1a5fa8;border-top:none">
      <thead>
        <tr style="background:#e8f0fb">
          <th style="color:#1a5fa8;padding:6px 10px;text-align:left;font-size:11px" colspan="2">Send To</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td style="padding:7px 10px;font-weight:600;font-size:12px">${d.sendTo || '-'}</td>
        </tr>
      </tbody>
    </table>

    <table class="pt">
      <thead><tr>
        <th style="width:28px">No.</th>
        <th>Description</th>
        <th style="width:40px">Qty</th>
        <th style="width:46px">Unit</th>
        <th>Remark</th>
        <th style="width:90px;text-align:center">Picture</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>

    <div class="sign-grid">
      <div class="sign-col">
        <div class="sign-col-label">Issue by</div>
        <div class="sign-col-name">${d.nameIssueBy || ''}</div>
        <div class="sign-col-date">${fmtDateClean(d.issueDate)}</div>
        <div class="sign-space"><span class="sign-space-lbl">Signature</span></div>
      </div>
      <div class="sign-col">
        <div class="sign-col-label">Check by</div>
        <div class="sign-col-name">${d.nameCheckBy || ''}</div>
        <div class="sign-col-date">${fmtDateClean(d.checkDate)}</div>
        <div class="sign-space"><span class="sign-space-lbl">Signature</span></div>
      </div>
      <div class="sign-col">

function doPrint(allItems, header) {
  const pages = [];
  for (let i = 0; i < allItems.length; i += ITEMS_PER_PAGE) {
    pages.push(allItems.slice(i, i + ITEMS_PER_PAGE));
  }
  const total = Math.max(pages.length, 1);
  const html = pages.map((pg, idx) => buildPrintPage(pg, header, total, idx + 1)).join('');
  document.getElementById('print-area').innerHTML = html;
  window.print();
}

async function saveDocket() {
  const rows = document.querySelectorAll('#items-body tr');
  if (rows.length === 0) { showMsg('msg-new', 'Please add at least one item.', 'error'); return; }
  const { items, valid } = getFormItems();
  if (!valid) { showMsg('msg-new', 'Please fill in description for all items.', 'error'); return; }

  // Upload images first
  showMsg('msg-new', 'Uploading images...', 'success');
  for (let item of items) {
    if (item.imageData) {
      try {
        const res = await fetch(API, { method: 'POST', body: JSON.stringify({
          action: 'uploadImage',
          imageData: item.imageData,
          mimeType: item.mimeType,
          fileName: item.fileName
        })});
        const data = await res.json();
        if (data.success) item.fileId = data.fileId;
      } catch(e) { console.error('Image upload failed', e); }
    }
  }

  showMsg('msg-new', 'Saving docket...', 'success');
  const payload = { action: 'createDocket', ...getFormHeader(), items };
  try {
    const res = await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
    const data = await res.json();
    if (data.success) { showMsg('msg-new', '✓ Docket ' + data.docNo + ' saved successfully!', 'success'); clearForm(); }
    else showMsg('msg-new', 'Error: ' + (data.error || 'Unknown error'), 'error');
  } catch (e) { showMsg('msg-new', 'Connection error. Please try again.', 'error'); }
}

function fmtDateClean(val) {
  if (!val) return '-';
  // Handle ISO string like 2026-06-01T07:00:00.000Z
  const s = String(val);
  if (s.includes('T')) {
    const d = new Date(s);
    if (!isNaN(d)) return d.toLocaleDateString('en-GB', {day:'2-digit',month:'2-digit',year:'numeric'});
  }
  // Handle dd/mm/yyyy or yyyy-mm-dd already clean
  return val;
}

function fmtDate(val) {
  if (!val) return '-';
  const d = new Date(val);
  if (isNaN(d)) return val;
  return d.toLocaleDateString('en-GB', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function renderDocketList(dockets) {
  const container = document.getElementById('docket-list-container');
  if (dockets.length === 0) { container.innerHTML = '<div class="loading">No dockets found.</div>'; return; }

  // Group by docNo, collect all items per docket
  const unique = {};
  dockets.forEach(r => {
    if (!unique[r.docNo]) unique[r.docNo] = { ...r, itemCount: 0, pictures: [], descriptions: [], sendTos: [] };
    unique[r.docNo].itemCount++;
    if (r.picture) unique[r.docNo].pictures.push(r.picture);
    if (r.description) unique[r.docNo].descriptions.push(r.description);
    if (r.sendTo && !unique[r.docNo].sendTos.includes(r.sendTo)) unique[r.docNo].sendTos.push(r.sendTo);
  });

  // Sort newest first by docNo number
  const list = Object.values(unique).sort((a, b) => {
    const numA = parseInt((a.docNo || '').split('/').pop()) || 0;
    const numB = parseInt((b.docNo || '').split('/').pop()) || 0;
    return numB - numA;
  });

  container.innerHTML = '<div class="docket-list">' + list.map((d, idx) => {
    // Show up to 3 thumbnails - use lh3 for Drive File IDs
    const thumbs = d.pictures.slice(0, 3).map(pic => {
      const src = pic && pic.length > 20
        ? `https://drive.google.com/thumbnail?id=${pic}&sz=w120`
        : '';
      return src ? `<img src="${src}" style="width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid #ddd;flex-shrink:0" onerror="this.style.display='none'" alt="">` : '';
    }).join('');

    const thumbsHtml = thumbs
      ? `<div style="display:flex;gap:6px;align-items:center">${thumbs}</div>`
      : `<div style="width:64px;height:64px;border-radius:6px;border:1.5px dashed #ccc;display:flex;align-items:center;justify-content:center;font-size:24px;color:#ccc;flex-shrink:0">📷</div>`;

    return `
    <div class="docket-item" onclick="viewDocket('${d.docNo}')">
      <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;min-width:32px">
        <span style="font-size:11px;color:#aaa;font-weight:600">${list.length - idx}</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;flex:1">
        ${thumbsHtml}
        <div style="min-width:0">
          <div style="font-weight:600;font-size:14px">${d.docNo}</div>
          <div style="font-size:12px;color:#666;margin-top:2px">${d.project || '-'} · ${d.jobNumber || '-'}</div>
          <div style="font-size:11px;color:#888;margin-top:1px">Send to: ${d.sendTo || '-'} · ${d.itemCount} item${d.itemCount > 1 ? 's' : ''} · ${fmtDateClean(d.requestDate)}</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-shrink:0">${badgeHtml(d.status)} ›</div>
    </div>`;
  }).join('') + '</div>';
}

function filterDockets() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  const s = document.getElementById('status-filter').value;

  // Group allDocketsCache by docNo first for searching across all fields
  const unique = {};
  allDocketsCache.forEach(r => {
    if (!unique[r.docNo]) unique[r.docNo] = { ...r, itemCount: 0, pictures: [], allText: '' };
    unique[r.docNo].itemCount++;
    if (r.picture) unique[r.docNo].pictures.push(r.picture);
    // Collect all searchable text per docket
    unique[r.docNo].allText += ' ' + [
      r.docNo, r.project, r.jobNumber, r.sendTo,
      r.nameIssueBy, r.nameCheckBy, r.nameDeliveryBy, r.nameReceivedBy,
      r.description, r.remark, r.requestDate
    ].join(' ').toLowerCase();
  });

  const list = Object.values(unique).filter(d => {
    const matchQ = !q || d.allText.includes(q);
    const matchS = !s || d.status === s;
    return matchQ && matchS;
  });

  if (list.length === 0) {
    document.getElementById('docket-list-container').innerHTML = '<div class="loading">No results found.</div>';
    return;
  }

  // Re-render with filtered list using same format
  renderDocketList(allDocketsCache.filter(r => list.some(d => d.docNo === r.docNo)));
}

function toInputDate(val) {
  if (!val) return '';
  const s = String(val);
  if (s.includes('T')) {
    const d = new Date(s);
    if (!isNaN(d)) return d.toISOString().split('T')[0];
  }
  // dd/mm/yyyy → yyyy-mm-dd
  if (s.includes('/')) {
    const parts = s.split('/');
    if (parts.length === 3) return parts[2]+'-'+parts[1].padStart(2,'0')+'-'+parts[0].padStart(2,'0');
  }
  return s;
}

function handleEditFile(n, input) {
  const file = input.files[0];

  document.getElementById('e-fname-' + n).textContent = file.name;

  const reader = new FileReader();
  reader.onload = e => {

  reader.readAsDataURL(file);

        })});

        if (data.success) item.fileId = data.fileId;
      } catch(e) {}

  }

  showMsg('msg-detail', 'Saving...', 'success');
  const payload = {
    action: 'updateDocket',
    docNo: currentDocNo,
    requestDate: document.getElementById('e-reqdate').value,
    project: document.getElementById('e-project').value,
    jobNumber: document.getElementById('e-jobno').value,

  };

  try {
    const res = await fetch(API, { method: 'POST', body: JSON.stringify(payload) });
    const data = await res.json();
    if (data.success) {
      showMsg('msg-detail', '✓ Updated successfully!', 'success');
      editMode = false;
      document.getElementById('btn-edit-detail').style.display = 'inline-block';
      document.getElementById('btn-save-edit').style.display = 'none';
      document.getElementById('btn-cancel-edit').style.display = 'none';
      document.getElementById('btn-print-detail').style.display = 'inline-block';
      viewDocket(currentDocNo);
    } else {
      showMsg('msg-detail', 'Error: ' + (data.error || 'Unknown'), 'error');
    }
  } catch(e) { showMsg('msg-detail', 'Connection error.', 'error'); }
}

async function deleteItem(docNo, itemNo) {
  if (!confirm('Delete item ' + itemNo + ' from ' + docNo + '?')) return;
  showMsg('msg-detail', 'Deleting...', 'success');
  try {
    const res = await fetch(API, { method: 'POST', body: JSON.stringify({
      action: 'deleteItem', docNo, itemNo
    })});
    const data = await res.json();
    if (data.success) {
      if (data.remainingItems === 0) {
        showMsg('msg-detail', 'All items deleted. Returning to list...', 'success');
        setTimeout(() => showPage('list'), 1500);
      } else {
        showMsg('msg-detail', '✓ Item deleted.', 'success');
        viewDocket(docNo);
      }
    } else {
      showMsg('msg-detail', 'Error: ' + (data.error || 'Cannot delete'), 'error');
    }
  } catch(e) { showMsg('msg-detail', 'Connection error.', 'error'); }
}

async function markSigned(docNo, type) {
  showMsg('msg-detail', 'Updating...', 'success');
  try {
    const res = await fetch(API, { method: 'POST', body: JSON.stringify({ action: 'updateSigned', docNo, type }) });
    const data = await res.json();
    if (data.success) { showMsg('msg-detail', '✓ Updated successfully!', 'success'); viewDocket(docNo); }
    else showMsg('msg-detail', 'Error updating.', 'error');
  } catch (e) { showMsg('msg-detail', 'Connection error.', 'error'); }
}
